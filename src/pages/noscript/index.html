<!DOCTYPE html>
<html lang="ja-JP">

<head>

    <meta property="og:description" content="JavaScript が無効です。 | 『YDITS for Web』は防災情報をすぐに確認できるWebアプリケーションです。">

    <link rel="preconnect" href="https://cdn.ydits.net">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <footer>
        <div class="wrapper">
            <span id="footerCopyright">© よね/Yone</span>
        </div>
